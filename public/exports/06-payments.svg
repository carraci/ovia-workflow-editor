nd="url(#arrow)"/><path d="M3195.2000000000003,201 L3265.2000000000003,201 L3335.2000000000003,201" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M2330.8,201 L2445,426 L2559.2000000000003,597" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="2354.1" y="288.5" width="67.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="2387.9" y="301.5">No / rejected</tspan></text><path d="M2807.2000000000003,597 L2877.2000000000003,597 L2947.2000000000003,597" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><path d="M1554.8,300 L1624.8,399 L1818.8,399 L2012.8,399 L2082.8,399" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1680.2" y="374" width="83.2" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1721.8" y="387">Provider webhook</tspan></text><path d="M2330.8,399 L2445,246 L2559.2000000000003,201" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="2351.5" y="327.5" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="2387.9" y="340.5">Verified event</tspan></text><path d="M2330.8,399 L2445,552 L2559.2000000000003,597" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="2343.7000000000003" y="450.5" width="88.4" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="2387.9" y="463.5">Invalid signature</tspan></text><path d="M318,399 L388,597 L582,597 L776,597 L970,597 L1200.4,597 L1430.8,597 L1624.8,597 L1818.8,597 L2012.8,597 L2082.8,597" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1048.8" y="572" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1085.2" y="585">PayPal sandbox</tspan></text><path d="M2330.8,597 L2445,372 L2559.2000000000003,201" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="2346.3" y="489.5" width="83.2" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="2387.9" y="502.5">Verified capture</tspan></text><path d="M2330.8,597 L2445,678 L2559.2000000000003,597" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><g><title>Customer confirms the reviewed quote and starts provider checkout.</title><rect x="70" y="338" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="84" y="353" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="97.5" y="371" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="121" y="369" font-size="10" font-weight="600" fill="#3979de">Trigger</text><text x="86" y="397" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Launch secure checkout</tspan></text><path d="M86 430H302" stroke="#edf0f3"/><circle cx="90" cy="445" r="3" fill="#3979de"/><text x="99" y="448" font-size="9" fill="#64748b">Implemented</text><text x="302" y="448" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validate input, owner, origin and rate limits before beginRazorpayCheckout.</title><rect x="458" y="239" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="472" y="254" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="485.5" y="272" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="509" y="270" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="474" y="298" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Create Razorpay session</tspan></text><path d="M474 331H690" stroke="#edf0f3"/><circle cx="478" cy="346" r="3" fill="#db8a2d"/><text x="487" y="349" font-size="9" fill="#64748b">Implemented</text><text x="690" y="349" text-anchor="end" font-size="9" fill="#7a8898">source :27</text></g><g><title>createOrder reserves stock and creates a durable order; provider order data is attached.</title><rect x="846" y="239" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="254" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="272" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="270" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="862" y="298" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Create local payment order</tspan></text><path d="M862 331H1078" stroke="#edf0f3"/><circle cx="866" cy="346" r="3" fill="#8855c6"/><text x="875" y="349" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="349" text-anchor="end" font-size="9" fill="#7a8898">source :322</text></g><g><title>Authenticated provider requests create and retrieve payment orders. Runtime configuration and connectivity are Unverified.</title><rect x="1306.8" y="239" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="1320.8" y="254" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="1334.3" y="272" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="1357.8" y="270" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="1322.8" y="298" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Razorpay Orders API</tspan></text><path d="M1322.8 331H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="346" r="3" fill="#219a97"/><text x="1335.8" y="349" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="349" text-anchor="end" font-size="9" fill="#7a8898">source :109</text></g><g><title>verifyRazorpayPayment validates returned payment identifiers and signature.</title><rect x="1694.8" y="140" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="1708.8" y="155" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="1722.3" y="173" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="1745.8" y="171" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="1710.8" y="199" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">POST signed verification</tspan></text><path d="M1710.8 232H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="247" r="3" fill="#db8a2d"/><text x="1723.8" y="250" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="250" text-anchor="end" font-size="9" fill="#7a8898">source :48</text></g><g><title>Amount, currency, remote order identity and capture status must match the local order.</title><rect x="2082.8" y="140" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2096.8" y="155" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2110.3" y="173" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2133.8" y="171" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="2098.8" y="199" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Captured payment matches?</tspan></text><path d="M2098.8 232H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="247" r="3" fill="#8855c6"/><text x="2111.8" y="250" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="250" text-anchor="end" font-size="9" fill="#7a8898">source :179</text></g><g><title>Duplicate events are checked; timely captures become paid, late captures require refund review.</title><rect x="2559.2000000000003" y="140" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2573.2000000000003" y="155" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2586.7000000000003" y="173" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2610.2000000000003" y="171" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="2575.2000000000003" y="199" font-size="13" font-weight="600" fill="#243449"><tspan x="2575.2000000000003" dy="0">Finalize payment</tspan></text><path d="M2575.2000000000003 232H2791.2000000000003" stroke="#edf0f3"/><circle cx="2579.2000000000003" cy="247" r="3" fill="#8855c6"/><text x="2588.2000000000003" y="250" font-size="9" fill="#64748b">Implemented</text><text x="2791.2000000000003" y="250" text-anchor="end" font-size="9" fill="#7a8898">source :211</text></g><g><title>Payment metadata remains on orders; event IDs protect replay; confirmation mail is queued only for confirmed purchases.</title><rect x="2947.2000000000003" y="140" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="2961.2000000000003" y="155" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="2974.7000000000003" y="173" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="2998.2000000000003" y="171" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="2963.2000000000003" y="199" font-size="13" font-weight="600" fill="#243449"><tspan x="2963.2000000000003" dy="0">orders + events + outbox</tspan></text><path d="M2963.2000000000003 232H3179.2000000000003" stroke="#edf0f3"/><circle cx="2967.2000000000003" cy="247" r="3" fill="#369969"/><text x="2976.2000000000003" y="250" font-size="9" fill="#64748b">Implemented</text><text x="3179.2000000000003" y="250" text-anchor="end" font-size="9" fill="#7a8898">source :7</text></g><g><title>Customer receives verified order state, never an assumed successful capture.</title><rect x="3335.2000000000003" y="140" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="3349.2000000000003" y="155" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="3362.7000000000003" y="173" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="3386.2000000000003" y="171" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="3351.2000000000003" y="199" font-size="13" font-weight="600" fill="#243449"><tspan x="3351.2000000000003" dy="0">Order confirmation</tspan></text><path d="M3351.2000000000003 232H3567.2000000000003" stroke="#edf0f3"/><circle cx="3355.2000000000003" cy="247" r="3" fill="#3979de"/><text x="3364.2000000000003" y="250" font-size="9" fill="#64748b">Implemented</text><text x="3567.2000000000003" y="250" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="2559.2000000000003" y="536" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2573.2000000000003" y="551" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2586.7000000000003" y="569" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2610.2000000000003" y="567" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="2575.2000000000003" y="595" font-size="13" font-weight="600" fill="#243449"><tspan x="2575.2000000000003" dy="0">Request failed</tspan></text><path d="M2575.2000000000003 628H2791.2000000000003" stroke="#edf0f3"/><circle cx="2579.2000000000003" cy="643" r="3" fill="#d65c65"/><text x="2588.2000000000003" y="646" font-size="9" fill="#64748b">Implemented</text><text x="2791.2000000000003" y="646" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="2947.2000000000003" y="536" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2961.2000000000003" y="551" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2974.7000000000003" y="569" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2998.2000000000003" y="567" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="2963.2000000000003" y="595" font-size="13" font-weight="600" fill="#243449"><tspan x="2963.2000000000003" dy="0">Show error / retry</tspan></text><path d="M2963.2000000000003 628H3179.2000000000003" stroke="#edf0f3"/><circle cx="2967.2000000000003" cy="643" r="3" fill="#d65c65"/><text x="2976.2000000000003" y="646" font-size="9" fill="#64748b">Implemented</text><text x="3179.2000000000003" y="646" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Stripe, Razorpay and PayPal dispatch; signature verification precedes reconciliation.</title><rect x="2082.8" y="338" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="2096.8" y="353" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="2110.3" y="371" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="2133.8" y="369" font-size="10" font-weight="600" fill="#db8a2d">Webhook</text><text x="2098.8" y="397" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Verified payment webhook</tspan></text><path d="M2098.8 430H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="445" r="3" fill="#db8a2d"/><text x="2111.8" y="448" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="448" text-anchor="end" font-size="9" fill="#7a8898">source :13</text></g><g><title>Create sandbox order, redirect approval, capture and verify provider response. Runtime configuration and connectivity are Unverified.</title><rect x="2082.8" y="536" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="2096.8" y="551" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="2110.3" y="569" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="2133.8" y="567" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="2098.8" y="595" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">PayPal sandbox approval</tspan></text><path d="M2098.8 628H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="643" r="3" fill="#219a97"/><text x="2111.8" y="646" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="646" text-anchor="end" font-size="9" fill="#7a8898">source :45</text></g></g><text x="34" y="749" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>