26.5">Facets</tspan></text><path d="M737.2,488 L843.6,614 L950,614" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1198,614 L1268,614 L1338,614" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1586,614 L1700.2,614 L1814.4,515" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1713.1000000000001" y="539.5" width="88.4" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1757.3000000000002" y="552.5">Filtered products</tspan></text><path d="M737.2,488 L843.6,290 L950,191" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="754.0000000000001" y="364" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="790.4000000000001" y="377">DB unavailable</tspan></text><g><title>Instant search modal and catalog filter UI.</title><rect x="70" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="84" y="343" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="97.5" y="361" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="121" y="359" font-size="10" font-weight="600" fill="#3979de">Trigger</text><text x="86" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Enter search or facets</tspan></text><path d="M86 420H302" stroke="#edf0f3"/><circle cx="90" cy="435" r="3" fill="#3979de"/><text x="99" y="438" font-size="9" fill="#64748b">Implemented</text><text x="302" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Query, limit and page are normalized; the route enforces a ten-second search timeout.</title><rect x="489.20000000000005" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="503.20000000000005" y="244" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="516.7" y="262" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="540.2" y="260" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="505.20000000000005" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="505.20000000000005" dy="0">GET catalog search</tspan></text><path d="M505.20000000000005 321H721.2" stroke="#edf0f3"/><circle cx="509.20000000000005" cy="336" r="3" fill="#db8a2d"/><text x="518.2" y="339" font-size="9" fill="#64748b">Implemented</text><text x="721.2" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :5</text></g><g><title>searchSingleIndex queries the configured products index. Runtime configuration and connectivity are Unverified.</title><rect x="950" y="355" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="964" y="370" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="977.5" y="388" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="1001" y="386" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="966" y="414" font-size="13" font-weight="600" fill="#243449"><tspan x="966" dy="0">Algolia search index</tspan></text><path d="M966 447H1182" stroke="#edf0f3"/><circle cx="970" cy="462" r="3" fill="#219a97"/><text x="979" y="465" font-size="9" fill="#64748b">Implemented</text><text x="1182" y="465" text-anchor="end" font-size="9" fill="#7a8898">source :42</text></g><g><title>Render returned hits and links to products.</title><rect x="1814.4" y="454" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="1828.4" y="469" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="1841.9" y="487" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="1865.4" y="485" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="1830.4" y="513" font-size="13" font-weight="600" fill="#243449"><tspan x="1830.4" dy="0">Search results</tspan></text><path d="M1830.4 546H2046.4" stroke="#edf0f3"/><circle cx="1834.4" cy="561" r="3" fill="#3979de"/><text x="1843.4" y="564" font-size="9" fill="#64748b">Implemented</text><text x="2046.4" y="564" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Unavailable configuration, timeout or provider failure returns HTTP 503.</title><rect x="950" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="964" y="145" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="977.5" y="163" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1001" y="161" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="966" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="966" dy="0">Request failed</tspan></text><path d="M966 222H1182" stroke="#edf0f3"/><circle cx="970" cy="237" r="3" fill="#d65c65"/><text x="979" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1182" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :19</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="1338" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1352" y="145" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1365.5" y="163" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1389" y="161" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="1354" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1354" dy="0">Show error / retry</tspan></text><path d="M1354 222H1570" stroke="#edf0f3"/><circle cx="1358" cy="237" r="3" fill="#d65c65"/><text x="1367" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1570" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :19</text></g><g><title>Database catalog filtering via filterProducts.</title><rect x="489.20000000000005" y="427" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="503.20000000000005" y="442" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="516.7" y="460" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="540.2" y="458" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="505.20000000000005" y="486" font-size="13" font-weight="600" fill="#243449"><tspan x="505.20000000000005" dy="0">GET filtered catalog</tspan></text><path d="M505.20000000000005 519H721.2" stroke="#edf0f3"/><circle cx="509.20000000000005" cy="534" r="3" fill="#db8a2d"/><text x="518.2" y="537" font-size="9" fill="#64748b">Implemented</text><text x="721.2" y="537" text-anchor="end" font-size="9" fill="#7a8898">source :46</text></g><g><title>Category, department and other Filters constrain product results.</title><rect x="1338" y="553" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1352" y="568" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1365.5" y="586" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1389" y="584" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="1354" y="612" font-size="13" font-weight="600" fill="#243449"><tspan x="1354" dy="0">Filter catalog facets</tspan></text><path d="M1354 645H1570" stroke="#edf0f3"/><circle cx="1358" cy="660" r="3" fill="#8855c6"/><text x="1367" y="663" font-size="9" fill="#64748b">Implemented</text><text x="1570" y="663" text-anchor="end" font-size="9" fill="#7a8898">source :51</text></g><g><title>Database catalog and SKU inventory balances.</title><rect x="950" y="553" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="964" y="568" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="977.5" y="586" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1001" y="584" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="966" y="612" font-size="13" font-weight="600" fill="#243449"><tspan x="966" dy="0">Read products + stock</tspan></text><path d="M966 645H1182" stroke="#edf0f3"/><circle cx="970" cy="660" r="3" fill="#369969"/><text x="979" y="663" font-size="9" fill="#64748b">Implemented</text><text x="1182" y="663" text-anchor="end" font-size="9" fill="#7a8898">source :182</text></g></g><text x="34" y="746" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>