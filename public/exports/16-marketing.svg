<svg xmlns="http://www.w3.org/2000/svg" width="2752.8" height="539" viewBox="0 0 2752.8 539"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a1adb9"/></marker><marker id="arrowError" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d65c65"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#e0e6ed"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><rect y="76" width="100%" height="463" fill="url(#grid)"/><text x="34" y="30" font-family="Arial,sans-serif" fill="#778497" font-size="10" letter-spacing="2">OVIA / WORKFLOW ATLAS</text><text x="34" y="57" font-family="Arial,sans-serif" fill="#23344b" font-size="19" font-weight="700">Marketing &amp; coupons</text><g font-family="Arial,sans-serif"><path d="M318,290 L388,290 L458,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,290 L776,290 L846,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,290 L1164,290 L1234,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1482,290 L1552,290 L1622,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1870,290 L1976.4,191 L2082.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1886.8" y="215.5" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1923.2" y="228.5">Yes / accepted</tspan></text><path d="M2330.8,191 L2400.8,191 L2470.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1870,290 L1976.4,389 L2082.8,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1889.4" y="314.5" width="67.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1923.2" y="327.5">No / rejected</tspan></text><path d="M2330.8,389 L2400.8,389 L2470.8,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><g><title>Marketing and coupon admin interfaces.</title><rect x="70" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="84" y="244" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="97.5" y="262" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="121" y="260" font-size="10" font-weight="600" fill="#3979de">Trigger</text><text x="86" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Owner manages campaign /</tspan><tspan x="86" dy="18">coupon</tspan></text><path d="M86 321H302" stroke="#edf0f3"/><circle cx="90" cy="336" r="3" fill="#3979de"/><text x="99" y="339" font-size="9" fill="#64748b">Implemented</text><text x="302" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Owner-authorized CRUD; campaign routes collect storefront activity.</title><rect x="458" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="472" y="244" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="485.5" y="262" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="509" y="260" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="474" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Marketing / coupon API</tspan></text><path d="M474 321H690" stroke="#edf0f3"/><circle cx="478" cy="336" r="3" fill="#db8a2d"/><text x="487" y="339" font-size="9" fill="#64748b">Implemented</text><text x="690" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :18</text></g><g><title>Validate discount, eligibility, usage and expiration settings.</title><rect x="846" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="244" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="260" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="862" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Persist coupon rules</tspan></text><path d="M862 321H1078" stroke="#edf0f3"/><circle cx="866" cy="336" r="3" fill="#8855c6"/><text x="875" y="339" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :1564</text></g><g><title>Campaign events and order campaignId support attribution; coupons store pricing rules.</title><rect x="1234" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1248" y="244" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1261.5" y="262" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1285" y="260" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1250" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="1250" dy="0">coupons and campaigns</tspan></text><path d="M1250 321H1466" stroke="#edf0f3"/><circle cx="1254" cy="336" r="3" fill="#369969"/><text x="1263" y="339" font-size="9" fill="#64748b">Implemented</text><text x="1466" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :22</text></g><g><title>Server reads current coupon and prior customer orders to apply allowed pricing.</title><rect x="1622" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1636" y="244" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1649.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1673" y="260" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="1638" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="1638" dy="0">Coupon eligible at checkout?</tspan></text><path d="M1638 321H1854" stroke="#edf0f3"/><circle cx="1642" cy="336" r="3" fill="#8855c6"/><text x="1651" y="339" font-size="9" fill="#64748b">Implemented</text><text x="1854" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :115</text></g><g><title>Confirmed order usage is recorded; pending checkout must not consume paid usage.</title><rect x="2082.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2096.8" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2110.3" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2133.8" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="2098.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Record paid coupon usage</tspan></text><path d="M2098.8 222H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="237" r="3" fill="#8855c6"/><text x="2111.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :312</text></g><g><title>Marketing UI and checkout display persisted campaign and discount outcomes.</title><rect x="2470.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="2484.8" y="145" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="2498.3" y="163" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="2521.8" y="161" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="2486.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2486.8" dy="0">Campaign and pricing results</tspan></text><path d="M2486.8 222H2702.8" stroke="#edf0f3"/><circle cx="2490.8" cy="237" r="3" fill="#3979de"/><text x="2499.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2702.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="2082.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2096.8" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2110.3" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2133.8" y="359" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="2098.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Request failed</tspan></text><path d="M2098.8 420H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="435" r="3" fill="#d65c65"/><text x="2111.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="2470.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2484.8" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2498.3" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2521.8" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="2486.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="2486.8" dy="0">Show error / retry</tspan></text><path d="M2486.8 420H2702.8" stroke="#edf0f3"/><circle cx="2490.8" cy="435" r="3" fill="#d65c65"/><text x="2499.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="2702.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>