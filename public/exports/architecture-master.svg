.6" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="541.6" dy="0">Storefront and account</tspan></text><path d="M541.6 222H757.6" stroke="#edf0f3"/><circle cx="545.6" cy="237" r="3" fill="#3979de"/><text x="554.6" y="240" font-size="9" fill="#64748b">Implemented</text><text x="757.6" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>86 route files, including explicit dispatch branches and provider webhooks.</title><rect x="976" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="990" y="244" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="1003.5" y="262" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="1027" y="260" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="992" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="992" dy="0">Next.js API handlers</tspan></text><path d="M992 321H1208" stroke="#edf0f3"/><circle cx="996" cy="336" r="3" fill="#db8a2d"/><text x="1005" y="339" font-size="9" fill="#64748b">Implemented</text><text x="1208" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :42</text></g><g><title>Commerce, accounts, logistics, mail, support, marketing and reports.</title><rect x="1400.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1414.4" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1427.9" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1451.4" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="1416.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1416.4" dy="0">Server business services</tspan></text><path d="M1416.4 222H1632.4" stroke="#edf0f3"/><circle cx="1420.4" cy="237" r="3" fill="#8855c6"/><text x="1429.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1632.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :115</text></g><g><title>MongoClient pool; repository access and withTransaction for coordinated writes.</title><rect x="1788.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1802.4" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1815.9" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1839.4" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1804.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1804.4" dy="0">Native MongoDB repository</tspan></text><path d="M1804.4 222H2020.4" stroke="#edf0f3"/><circle cx="1808.4" cy="237" r="3" fill="#369969"/><text x="1817.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2020.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :44</text></g><g><title>Razorpay, PayPal sandbox, Delhivery, Resend, Algolia, OAuth, Gmail, translation and DeepSeek. Runtime configuration and connectivity are Unverified.</title><rect x="2176.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="2190.4" y="145" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="2203.9" y="163" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="2227.4" y="161" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="2192.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2192.4" dy="0">External service adapters</tspan></text><path d="M2192.4 222H2408.4" stroke="#edf0f3"/><circle cx="2196.4" cy="237" r="3" fill="#219a97"/><text x="2205.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2408.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :88</text></g><g><title>Safe route responses update customer and owner views.</title><rect x="2564.4" y="130" width=