" font-size="15" fill="#d65c65">!</text><text x="1839.4" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="1804.4" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1804.4" dy="0">Show error / retry</tspan></text><path d="M1804.4 420H2020.4" stroke="#edf0f3"/><circle cx="1808.4" cy="435" r="3" fill="#d65c65"/><text x="1817.4" y="438" font-size="9" fill="#64748b">Implemented</text><text x="2020.4" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Server-protected owner operations and API-specific authorization.</title><rect x="525.6" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#687381" stroke-opacity=".48" /><rect x="539.6" y="343" width="27" height="27" rx="7" fill="#687381" fill-opacity=".1"/><text x="553.1" y="361" text-anchor="middle" font-size="15" fill="#687381">⌘</text><text x="576.6" y="359" font-size="10" font-weight="600" fill="#687381">Frontend Action</text><text x="541.6" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="541.6" dy="0">Owner control center</tspan></text><path d="M541.6 420H757.6" stroke="#edf0f3"/><circle cx="545.6" cy="435" r="3" fill="#687381"/><text x="554.6" y="438" font-size="9" fill="#64748b">Implemented</text><text x="757.6" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>