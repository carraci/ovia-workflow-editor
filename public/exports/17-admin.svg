<svg xmlns="http://www.w3.org/2000/svg" width="2716.4" height="539" viewBox="0 0 2716.4 539"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a1adb9"/></marker><marker id="arrowError" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d65c65"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#e0e6ed"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><rect y="76" width="100%" height="463" fill="url(#grid)"/><text x="34" y="30" font-family="Arial,sans-serif" fill="#778497" font-size="10" letter-spacing="2">OVIA / WORKFLOW ATLAS</text><text x="34" y="57" font-family="Arial,sans-serif" fill="#23344b" font-size="19" font-weight="700">Admin dashboard &amp; operations</text><g font-family="Arial,sans-serif"><path d="M318,290 L388,290 L458,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,290 L794.2,191 L882.4,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1130.4,191 L1200.4,191 L1270.4,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1518.4,191 L1588.4,191 L1658.4,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1906.4,191 L1976.4,191 L2046.4,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M2294.4,191 L2364.4,191 L2434.4,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,290 L794.2,389 L882.4,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="720.1" y="314.5" width="60" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="750.1" y="327.5">Failure</tspan></text><path d="M1130.4,389 L1200.4,389 L1270.4,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><g><title>Admin shell groups operations and navigation.</title><rect x="70" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="84" y="244" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="97.5" y="262" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="121" y="260" font-size="10" font-weight="600" fill="#3979de">Trigger</text><text x="86" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Open admin control center</tspan></text><path d="M86 321H302" stroke="#edf0f3"/><circle cx="90" cy="336" r="3" fill="#3979de"/><text x="99" y="339" font-size="9" fill="#64748b">Implemented</text><text x="302" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Server components redirect missing sessions, unauthorized roles or database unavailability.</title><rect x="458" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#687381" stroke-opacity=".48" /><rect x="472" y="244" width="27" height="27" rx="7" fill="#687381" fill-opacity=".1"/><text x="485.5" y="262" text-anchor="middle" font-size="15" fill="#687381">⌘</text><text x="509" y="260" font-size="10" font-weight="600" fill="#687381">Authentication</text><text x="474" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Require owner role</tspan></text><path d="M474 321H690" stroke="#edf0f3"/><circle cx="478" cy="336" r="3" fill="#687381"/><text x="487" y="339" font-size="9" fill="#64748b">Implemented</text><text x="690" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :81</text></g><g><title>Each API independently authorizes the owner session; no central middleware is invented.</title><rect x="882.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="896.4" y="145" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="909.9" y="163" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="933.4" y="161" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="898.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="898.4" dy="0">Admin route handlers</tspan></text><path d="M898.4 222H1114.4" stroke="#edf0f3"/><circle cx="902.4" cy="237" r="3" fill="#db8a2d"/><text x="911.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1114.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :7</text></g><g><title>Actual services cover products, inventory, orders, customers, payments, returns, support and settings.</title><rect x="1270.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1284.4" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1297.9" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1321.4" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="1286.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1286.4" dy="0">Run selected operation</tspan></text><path d="M1286.4 222H1502.4" stroke="#edf0f3"/><circle cx="1290.4" cy="237" r="3" fill="#8855c6"/><text x="1299.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1502.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :52</text></g><g><title>Repository queries and transactional mutations use native MongoDB driver.</title><rect x="1658.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1672.4" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1685.9" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1709.4" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1674.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1674.4" dy="0">Stored business collections</tspan></text><path d="M1674.4 222H1890.4" stroke="#edf0f3"/><circle cx="1678.4" cy="237" r="3" fill="#369969"/><text x="1687.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1890.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :44</text></g><g><title>Critical owner operations record actor, action, resource, resourceId and details.</title><rect x="2046.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="2060.4" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="2073.9" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="2097.4" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="2062.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2062.4" dy="0">Audit critical changes</tspan></text><path d="M2062.4 222H2278.4" stroke="#edf0f3"/><circle cx="2066.4" cy="237" r="3" fill="#369969"/><text x="2075.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2278.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :224</text></g><g><title>Admin client refresh hooks request current data.</title><rect x="2434.4" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="2448.4" y="145" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="2461.9" y="163" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="2485.4" y="161" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="2450.4" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2450.4" dy="0">Refresh admin view</tspan></text><path d="M2450.4 222H2666.4" stroke="#edf0f3"/><circle cx="2454.4" cy="237" r="3" fill="#3979de"/><text x="2463.4" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2666.4" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="882.4" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="896.4" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="909.9" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="933.4" y="359" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="898.4" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="898.4" dy="0">Request failed</tspan></text><path d="M898.4 420H1114.4" stroke="#edf0f3"/><circle cx="902.4" cy="435" r="3" fill="#d65c65"/><text x="911.4" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1114.4" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="1270.4" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1284.4" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1297.9" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1321.4" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="1286.4" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1286.4" dy="0">Show error / retry</tspan></text><path d="M1286.4 420H1502.4" stroke="#edf0f3"/><circle cx="1290.4" cy="435" r="3" fill="#d65c65"/><text x="1299.4" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1502.4" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>