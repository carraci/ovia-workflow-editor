<svg xmlns="http://www.w3.org/2000/svg" width="2773.6" height="621" viewBox="0 0 2773.6 621"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a1adb9"/></marker><marker id="arrowError" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d65c65"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#e0e6ed"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><rect y="76" width="100%" height="545" fill="url(#grid)"/><text x="34" y="30" font-family="Arial,sans-serif" fill="#778497" font-size="10" letter-spacing="2">OVIA / WORKFLOW ATLAS</text><text x="34" y="57" font-family="Arial,sans-serif" fill="#23344b" font-size="19" font-weight="700">Inventory &amp; stock updates</text><g font-family="Arial,sans-serif"><path d="M318,344.5 L388,218 L458,218" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,218 L776,218 L846,218" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,218 L1210.8,191 L1327.6,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1116" y="179.5" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1152.4" y="192.5">Yes / accepted</tspan></text><path d="M1575.6,191 L1645.6,191 L1715.6,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1963.6,191 L2033.6,191 L2103.6,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M2351.6,191 L2421.6,191 L2491.6,344.5" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,218 L1210.8,317 L1327.6,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1118.6000000000001" y="242.5" width="67.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1152.4" y="255.5">No / rejected</tspan></text><path d="M1575.6,389 L1645.6,389 L1715.6,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><path d="M318,344.5 L388,471 L582,471 L776,471 L846,471" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="443.4" y="446" width="83.2" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="485" y="459">Owner adjustment</tspan></text><path d="M1094,471 L1210.8,498 L1451.6,498 L1645.6,498 L1839.6,498 L2033.6,498 L2227.6,498 L2421.6,498 L2491.6,344.5" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,471 L1210.8,416.5 L1327.6,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1105.6000000000001" y="418.75" width="93.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1152.4" y="431.75">Invalid adjustment</tspan></text><g><title>Reservation runs within checkout order creation; expiry runs via protected cron.</title><rect x="70" y="283.5" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="84" y="298.5" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="97.5" y="316.5" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="121" y="314.5" font-size="10" font-weight="600" fill="#8855c6">Trigger</text><text x="86" y="342.5" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Checkout or expiry trigger</tspan></text><path d="M86 375.5H302" stroke="#edf0f3"/><circle cx="90" cy="390.5" r="3" fill="#8855c6"/><text x="99" y="393.5" font-size="9" fill="#64748b">Implemented</text><text x="302" y="393.5" text-anchor="end" font-size="9" fill="#7a8898">source :115</text></g><g><title>inventory.id equals variant SKU; available quantity is loaded or derived from product variants.</title><rect x="458" y="157" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="472" y="172" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="485.5" y="190" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="509" y="188" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="474" y="216" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Read SKU balance</tspan></text><path d="M474 249H690" stroke="#edf0f3"/><circle cx="478" cy="264" r="3" fill="#369969"/><text x="487" y="267" font-size="9" fill="#64748b">Implemented</text><text x="690" y="267" text-anchor="end" font-size="9" fill="#7a8898">source :104</text></g><g><title>Reject overselling with HTTP 409 before updating the order.</title><rect x="846" y="157" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="172" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="190" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="188" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="862" y="216" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Sufficient available stock?</tspan></text><path d="M862 249H1078" stroke="#edf0f3"/><circle cx="866" cy="264" r="3" fill="#8855c6"/><text x="875" y="267" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="267" text-anchor="end" font-size="9" fill="#7a8898">source :158</text></g><g><title>Balance decrement and order insert share the MongoDB transaction.</title><rect x="1327.6" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1341.6" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1355.1" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1378.6" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1343.6" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1343.6" dy="0">Reserve stock atomically</tspan></text><path d="M1343.6 222H1559.6" stroke="#edf0f3"/><circle cx="1347.6" cy="237" r="3" fill="#369969"/><text x="1356.6" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1559.6" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :165</text></g><g><title>Expiry code releases nonfinal inventory once; cancellation has its own release path.</title><rect x="1715.6" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1729.6" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1743.1" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1766.6" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="1731.6" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1731.6" dy="0">Release expired reservation</tspan></text><path d="M1731.6 222H1947.6" stroke="#edf0f3"/><circle cx="1735.6" cy="237" r="3" fill="#8855c6"/><text x="1744.6" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1947.6" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :296</text></g><g><title>inventoryReleased protects repeated release.</title><rect x="2103.6" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="2117.6" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="2131.1" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="2154.6" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="2119.6" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2119.6" dy="0">Update inventory + order</tspan></text><path d="M2119.6 222H2335.6" stroke="#edf0f3"/><circle cx="2123.6" cy="237" r="3" fill="#369969"/><text x="2132.6" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2335.6" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :231</text></g><g><title>Catalog overlays inventory on variant stock.</title><rect x="2491.6" y="283.5" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="2505.6" y="298.5" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="2519.1" y="316.5" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="2542.6" y="314.5" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="2507.6" y="342.5" font-size="13" font-weight="600" fill="#243449"><tspan x="2507.6" dy="0">Updated availability</tspan></text><path d="M2507.6 375.5H2723.6" stroke="#edf0f3"/><circle cx="2511.6" cy="390.5" r="3" fill="#3979de"/><text x="2520.6" y="393.5" font-size="9" fill="#64748b">Implemented</text><text x="2723.6" y="393.5" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="1327.6" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1341.6" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1355.1" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1378.6" y="359" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="1343.6" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1343.6" dy="0">Request failed</tspan></text><path d="M1343.6 420H1559.6" stroke="#edf0f3"/><circle cx="1347.6" cy="435" r="3" fill="#d65c65"/><text x="1356.6" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1559.6" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="1715.6" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1729.6" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1743.1" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1766.6" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="1731.6" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1731.6" dy="0">Show error / retry</tspan></text><path d="M1731.6 420H1947.6" stroke="#edf0f3"/><circle cx="1735.6" cy="435" r="3" fill="#d65c65"/><text x="1744.6" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1947.6" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>PATCH /api/admin/inventory updates inventory, product variant stock, inventoryMovements and audit.</title><rect x="846" y="410" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="425" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="443" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="441" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="862" y="469" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Owner stock adjustment</tspan></text><path d="M862 502H1078" stroke="#edf0f3"/><circle cx="866" cy="517" r="3" fill="#8855c6"/><text x="875" y="520" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="520" text-anchor="end" font-size="9" fill="#7a8898">source :1215</text></g></g><text x="34" y="603" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>