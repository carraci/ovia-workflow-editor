000000000004" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="2931.6000000000004" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2945.6000000000004" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2959.1000000000004" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2982.6000000000004" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="2947.6000000000004" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="2947.6000000000004" dy="0">Show error / retry</tspan></text><path d="M2947.6000000000004 420H3163.6000000000004" stroke="#edf0f3"/><circle cx="2951.6000000000004" cy="435" r="3" fill="#d65c65"/><text x="2960.6000000000004" y="438" font-size="9" fill="#64748b">Implemented</text><text x="3163.6000000000004" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>