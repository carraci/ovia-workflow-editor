="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="485.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="509" y="260" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="474" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Idempotent createOrder</tspan></text><path d="M474 321H690" stroke="#edf0f3"/><circle cx="478" cy="336" r="3" fill="#8855c6"/><text x="487" y="339" font-size="9" fill="#64748b">Implemented</text><text x="690" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :115</text></g><g><title>Empty carts, changed quoteId, incompatible providers and insufficient stock are rejected.</title><rect x="846" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="244" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="260" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="862" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Quote and stock still valid?</tspan></text><path d="M862 321H1078" stroke="#edf0f3"/><circle cx="866" cy="336" r="3" fill="#8855c6"/><text x="875" y="339" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :154</text></g><g><title>Order contains address, line snapshots, provider IDs, owner, userId and expiry.</title><rect x="1306.8" y="157" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1320.8" y="172" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1334.3" y="190" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1357.8" y="188" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1322.8" y="216" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Persist orders</tspan></text><path d="M1322.8 249H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="264" r="3" fill="#369969"/><text x="1335.8" y="267" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="267" text-anchor="end" font-size="9" fill="#7a8898">source :184</text></g><g><title>Lookup by ID or order number; ownership and allowed staff roles are checked.</title><rect x="1694.8" y="157" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="1708.8" y="172" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="1722.3" y="190" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="1745.8" y="188" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="1710.8" y="216" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">Read customer order</tspan></text><path d="M1710.8 249H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="264" r="3" fill="#db8a2d"/><text x="1723.8" y="267" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="267" text-anchor="end" font-size="9" fill="#7a8898">source :79</text></g><g><title>Unauthorized access returns 403; owner and idempotencyKey fields are removed from public responses.</title><rect x="2082.8" y="157" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2096.8" y="172" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2110.3" y="190" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2133.8" y="188" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="2098.8" y="216" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Owner or allowed staff?</tspan></text><path d="M2098.8 249H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="264" r="3" fill="#8855c6"/><text x="2111.8" y="267" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" 