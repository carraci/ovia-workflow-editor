d</text><text x="302" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>PATCH and DELETE /api/v1/cart/items/:sku are also implemented.</title><rect x="458" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="472" y="145" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="485.5" y="163" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="509" y="161" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="474" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Cart mutation</tspan></text><path d="M474 222H690" stroke="#edf0f3"/><circle cx="478" cy="237" r="3" fill="#db8a2d"/><text x="487" y="240" font-size="9" fill="#64748b">Implemented</text><text x="690" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :351</text></g><g><title>Signed-in user ID or SHA256-hashed guest cookie identifies the cart.</title><rect x="846" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="862" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Resolve cart owner</tspan></text><path d="M862 222H1078" stroke="#edf0f3"/><circle cx="866" cy="237" r="3" fill="#8855c6"/><text x="875" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :168</text></g><g><title>Available variant, quantity 0-10 and optional cart version check; stale versions return 409.</title><rect x="1234" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1248" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1261.5" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1285" y="161" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="1250" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1250" dy="0">Valid SKU and quantity?</tspan></text><path d="M1250 222H1466" stroke="#edf0f3"/><circle cx="1254" cy="237" r="3" fill="#8855c6"/><text x="1263" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1466" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :70</text></g><g><title>Cart contains id, lines[].sku, lines[].quantity and version.</title><rect x="1694.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1708.8" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1722.3" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1745.8" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1710.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">Persist carts</tspan></text><path d="M1710.8 222H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="237" r="3" fill="#369969"/><text x="1723.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :95</text></g><g><title>Render server-confirmed line items and totals.</title><rect x="2155.6" y="164.5" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="2169.6" y="179.5" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="2183.1" y="197.5" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="2206.6" y="195.5" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="2171.6" y="223.5" font-size="13" font-weight="600" fill="#243449"><tspan x="2171.6" dy="0">Refresh bag totals</tspan></text><path d="M2171.6 256.5H2387.6" stroke="#edf0f3"/><circle cx="2175.6" cy="271.5" r="3" fill="#3979de"/><text x="2184.6" y="274.5" font-size="9" fill="#64748b">Implemented</text><text x="2387.6" y="274.5" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="1694.8" y="526" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1708.8" y="541" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1722.3" y="559" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1745.8" y="557" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="1710.8" y="585" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">Request failed</tspan></text><path d="M1710.8 618H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="633" r="3" fill="#d65c65"/><text x="1723.8" y="636" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="636" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="2155.6" y="526" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2169.6" y="541" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2183.1" y="559" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2206.6" y="557" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="2171.6" y="585" font-size="13" font-weight="600" fill="#243449"><tspan x="2171.6" dy="0">Show error / retry</tspan></text><path d="M2171.6 618H2387.6" stroke="#edf0f3"/><circle cx="2175.6" cy="633" r="3" fill="#d65c65"/><text x="2184.6" y="636" font-size="9" fill="#64748b">Implemented</text><text x="2387.6" y="636" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>GET reads and DELETE removes saved items; authentication required.</title><rect x="846" y="427" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="860" y="442" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="873.5" y="460" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="897" y="458" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="862" y="486" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Account wishlist API</tspan></text><path d="M862 519H1078" stroke="#edf0f3"/><circle cx="866" cy="534" r="3" fill="#db8a2d"/><text x="875" y="537" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="537" text-anchor="end" font-size="9" fill="#7a8898">source :18</text></g><g><title>Validate input and catalog SKU.</title><rect x="1234" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1248" y="343" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1261.5" y="361" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1285" y="359" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="1250" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1250" dy="0">Validate saved variant</tspan></text><path d="M1250 420H1466" stroke="#edf0f3"/><circle cx="1254" cy="435" r="3" fill="#8855c6"/><text x="1263" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1466" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :25</text></g><g><title>Wishlist is embedded on users; no standalone wishlist collection is invented.</title><rect x="1694.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1708.8" y="343" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1722.3" y="361" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1745.8" y="359" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1710.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">users.accountWishlist</tspan></text><path d="M1710.8 420H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="435" r="3" fill="#369969"/><text x="1723.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :51</text></g></g><text x="34" y="719" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>