<svg xmlns="http://www.w3.org/2000/svg" width="2789.2" height="539" viewBox="0 0 2789.2 539"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a1adb9"/></marker><marker id="arrowError" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d65c65"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#e0e6ed"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><rect y="76" width="100%" height="463" fill="url(#grid)"/><text x="34" y="30" font-family="Arial,sans-serif" fill="#778497" font-size="10" letter-spacing="2">OVIA / WORKFLOW ATLAS</text><text x="34" y="57" font-family="Arial,sans-serif" fill="#23344b" font-size="19" font-weight="700">Security &amp; access control</text><g font-family="Arial,sans-serif"><path d="M318,317 L388,317 L458,317" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,317 L776,262.5 L846,262.5" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,262.5 L1200.4,191 L1306.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1110.8" y="201.75" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1147.2" y="214.75">Yes / accepted</tspan></text><path d="M1554.8,191 L1643,191 L1731.2,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1979.2,191 L2049.2,191 L2119.2,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M2367.2,191 L2437.2,191 L2507.2,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,317 L776,443 L970,443 L1200.4,443 L1430.8,443 L1643,443 L1731.2,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1055.2" y="418" width="60" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1085.2" y="431">Failure</tspan></text><path d="M1094,262.5 L1200.4,361.5 L1430.8,361.5 L1643,361.5 L1731.2,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1281.8" y="336.5" width="67.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1315.6" y="349.5">No / rejected</tspan></text><path d="M1554.8,191 L1643,280 L1731.2,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1657.1" y="309.5" width="60" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1687.1" y="322.5">Failure</tspan></text><path d="M1979.2,389 L2049.2,389 L2119.2,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><g><title>Applicable mutation handlers apply guards locally.</title><rect x="70" y="256" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="84" y="271" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="97.5" y="289" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="121" y="287" font-size="10" font-weight="600" fill="#db8a2d">Trigger</text><text x="86" y="315" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Incoming protected request</tspan></text><path d="M86 348H302" stroke="#edf0f3"/><circle cx="90" cy="363" r="3" fill="#db8a2d"/><text x="99" y="366" font-size="9" fill="#64748b">Implemented</text><text x="302" y="366" text-anchor="end" font-size="9" fill="#7a8898">source :15</text></g><g><title>Check HS256, issuer, audience, jti hash, session expiry and verified user record.</title><rect x="458" y="256" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="472" y="271" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="485.5" y="289" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="509" y="287" font-size="10" font-weight="600" fill="#8855c6">Authentication</text><text x="474" y="315" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">JWT and stored session</tspan></text><path d="M474 348H690" stroke="#edf0f3"/><circle cx="478" cy="363" r="3" fill="#8855c6"/><text x="487" y="366" font-size="9" fill="#64748b">Implemented</text><text x="690" y="366" text-anchor="end" font-size="9" fill="#7a8898">source :112</text></g><g><title>Owner admin APIs use normalized OWNER/ADMIN; legacy staff routes have different literal role checks.</title><rect x="846" y="201.5" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="216.5" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="234.5" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="232.5" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="862" y="260.5" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Required role / ownership?</tspan></text><path d="M862 293.5H1078" stroke="#edf0f3"/><circle cx="866" cy="308.5" r="3" fill="#8855c6"/><text x="875" y="311.5" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="311.5" text-anchor="end" font-size="9" fill="#7a8898">source :107</text></g><g><title>Origin allowlist and streamed body cap are helpers explicitly called by participating routes.</title><rect x="1306.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1320.8" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1334.3" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1357.8" y="161" font-size="10" font-weight="600" fill="#8855c6">Validation</text><text x="1322.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Origin and body limits</tspan></text><path d="M1322.8 222H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="237" r="3" fill="#8855c6"/><text x="1335.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :36</text></g><g><title>limits collection tracks scoped counts in a sixty-second window; exceeding threshold returns 429.</title><rect x="1731.2" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1745.2" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1758.7" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1782.2" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1747.2" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1747.2" dy="0">Rate limit counters</tspan></text><path d="M1747.2 222H1963.2" stroke="#edf0f3"/><circle cx="1751.2" cy="237" r="3" fill="#369969"/><text x="1760.2" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1963.2" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :107</text></g><g><title>Handlers parse Zod input and authorize the applicable resource before service mutations.</title><rect x="2119.2" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2133.2" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2146.7" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2170.2" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="2135.2" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2135.2" dy="0">Execute guarded handler</tspan></text><path d="M2135.2 222H2351.2" stroke="#edf0f3"/><circle cx="2139.2" cy="237" r="3" fill="#8855c6"/><text x="2148.2" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2351.2" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :219</text></g><g><title>api() maps Zod to 400, duplicate records to 409, ApiError to its code, unknown service errors to 503; redacts environment secrets.</title><rect x="2507.2" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="2521.2" y="145" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="2534.7" y="163" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="2558.2" y="161" font-size="10" font-weight="600" fill="#db8a2d">Response</text><text x="2523.2" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2523.2" dy="0">Safe success / error response</tspan></text><path d="M2523.2 222H2739.2" stroke="#edf0f3"/><circle cx="2527.2" cy="237" r="3" fill="#db8a2d"/><text x="2536.2" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2739.2" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="1731.2" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1745.2" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1758.7" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1782.2" y="359" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="1747.2" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1747.2" dy="0">Request failed</tspan></text><path d="M1747.2 420H1963.2" stroke="#edf0f3"/><circle cx="1751.2" cy="435" r="3" fill="#d65c65"/><text x="1760.2" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1963.2" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="2119.2" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="2133.2" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="2146.7" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="2170.2" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="2135.2" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="2135.2" dy="0">Show error / retry</tspan></text><path d="M2135.2 420H2351.2" stroke="#edf0f3"/><circle cx="2139.2" cy="435" r="3" fill="#d65c65"/><text x="2148.2" y="438" font-size="9" fill="#64748b">Implemented</text><text x="2351.2" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>