 rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="3543.3" y="395.5">Invalid / expired OTP</tspan></text><path d="M318,354.5 L388,535 L582,535 L776,535 L970,535 L1200.4,535 L1430.8,535 L1661.2,535 L1891.6,535 L2124.6,535 L2357.6,535 L2551.6,535 L2745.6,535 L2989,535 L3108.4,535" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="2830.9" y="510" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="2867.3" y="523">Social sign-in</tspan></text><path d="M3356.4,535 L3481,490.5 L3605.6,255.5" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="3499.1000000000004" y="348" width="88.4" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="3543.3" y="361">Identity verified</tspan></text><path d="M3356.4,535 L3481,562 L3605.6,470.5" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="3488.7000000000003" y="491.25" width="109.2" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="3543.3" y="504.25">Invalid state / token</tspan></text><g><title>Account authentication forms and verification experience.</title><rect x="70" y="293.5" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="84" y="308.5" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="97.5" y="326.5" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="121" y="324.5" font-size="10" font-weight="600" fill="#3979de">Trigger</text><text x="86" y="352.5" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Register or sign in</tspan></text><path d="M86 385.5H302" stroke="#edf0f3"/><circle cx="90" cy="400.5" r="3" fill="#3979de"/><text x="99" y="403.5" font-size="9" fill="#64748b">Implemented</text><text x="302" y="403.5" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Registration and login share the dispatcher. Password, email and terms requirements differ.</title><rect x="458" y="184.5" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="472" y="199.5" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="485.5" y="217.5" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="509" y="215.5" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="474" y="243.5" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">POST authentication</tspan></text><path d="M474 276.5H690" stroke="#edf0f3"/><circle cx="478" cy="291.5" r="3" fill="#db8a2d"/><text x="487" y="294.5" font-size="9" fill="#64748b">Implemented</text><text x="690" y="294.5" text-anchor="end" font-size="9" fill="#7a8898">source :223</text></g><g><title>Zod validation, password policy, duplicate email checks and scrypt password verification.</title><rect x="846" y="184.5" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="199.5" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="217.5" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="215.5" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="862" y="243.5" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Valid credentials?</tspan></text><path d="M862 276.5H1078" stroke="#edf0f3"/><circle cx="866" cy="291.5" r="3" fill="#8855c6"/><text x="875" y="294.5" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="294.5" text-anchor="end" font-size="9" fill="#7a8898">source :244</text></g><g><title>users: id, email, passwordHash, verification and terms fields.</title><rect x="1306.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1320.8" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1334.3" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1357.8" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1322.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Store / load user</tspan></text><path d="M1322.8 222H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="237" r="3" fill="#369969"/><text x="1335.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :268</text></g><g><title>Unverified accounts receive an email OTP. Verified accounts proceed to completeSignIn.</title><rect x="1767.6" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="1781.6" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="1795.1" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="1818.6" y="161" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="1783.6" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1783.6" dy="0">Email verified?</tspan></text><path d="M1783.6 222H1999.6" stroke="#edf0f3"/><circle cx="1787.6" cy="237" r="3" fill="#8855c6"/><text x="1796.6" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1999.6" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :282</text></g><g><title>Generate and hash a one-time verification code with expiration and attempt limits.</title><rect x="2233.6" y="256" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2247.6" y="271" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2261.1" y="289" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2284.6" y="287" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="2249.6" y="315" font-size="13" font-weight="600" fill="#243449"><tspan x="2249.6" dy="0">Issue email verification OTP</tspan></text><path d="M2249.6 348H2465.6" stroke="#edf0f3"/><circle cx="2253.6" cy="363" r="3" fill="#8855c6"/><text x="2262.6" y="366" font-size="9" fill="#64748b">Implemented</text><text x="2465.6" y="366" text-anchor="end" font-size="9" fill="#7a8898">source :184</text></g><g><title>Email provider HTTP call; failures cannot be treated as successful delivery. Runtime configuration and connectivity are Unverified.</title><rect x="2621.6" y="256" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="2635.6" y="271" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="2649.1" y="289" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="2672.6" y="287" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="2637.6" y="315" font-size="13" font-weight="600" fill="#243449"><tspan x="2637.6" dy="0">Resend email delivery</tspan></text><path d="M2637.6 348H2853.6" stroke="#edf0f3"/><circle cx="2641.6" cy="363" r="3" fill="#219a97"/><text x="2650.6" y="366" font-size="9" fill="#64748b">Implemented</text><text x="2853.6" y="366" text-anchor="end" font-size="9" fill="#7a8898">source :158</text></g><g><title>Merge guest cart and account state, then create the session.</title><rect x="3605.6" y="194.5" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="3619.6" y="209.5" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="3633.1" y="227.5" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="3656.6" y="225.5" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="3621.6" y="253.5" font-size="13" font-weight="600" fill="#243449"><tspan x="3621.6" dy="0">Complete sign-in</tspan></text><path d="M3621.6 286.5H3837.6" stroke="#edf0f3"/><circle cx="3625.6" cy="301.5" r="3" fill="#8855c6"/><text x="3634.6" y="304.5" font-size="9" fill="#64748b">Implemented</text><text x="3837.6" y="304.5" text-anchor="end" font-size="9" fill="#7a8898">source :4</text></g><g><title>HS256 JWT in HttpOnly cookie; hashed jti in sessions with userId and expiration.</title><rect x="3993.6" y="194.5" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="4007.6" y="209.5" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="4021.1" y="227.5" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="4044.6" y="225.5" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="4009.6" y="253.5" font-size="13" font-weight="600" fill="#243449"><tspan x="4009.6" dy="0">Persist JWT session</tspan></text><path d="M4009.6 286.5H4225.6" stroke="#edf0f3"/><circle cx="4013.6" cy="301.5" r="3" fill="#369969"/><text x="4022.6" y="304.5" font-size="9" fill="#64748b">Implemented</text><text x="4225.6" y="304.5" text-anchor="end" font-size="9" fill="#7a8898">source :63</text></g><g><title>Successful sign-in returns safe user fields and navigates the customer account.</title><rect x="4381.6" y="194.5" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="4395.6" y="209.5" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="4409.1" y="227.5" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="4432.6" y="225.5" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="4397.6" y="253.5" font-size="13" font-weight="600" fill="#243449"><tspan x="4397.6" dy="0">Account authenticated</tspan></text><path d="M4397.6 286.5H4613.6" stroke="#edf0f3"/><circle cx="4401.6" cy="301.5" r="3" fill="#3979de"/><text x="4410.6" y="304.5" font-size="9" fill="#64748b">Implemented</text><text x="4613.6" y="304.5" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="3605.6" y="409.5" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="3619.6" y="424.5" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="3633.1" y="442.5" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="3656.6" y="440.5" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="3621.6" y="468.5" font-size="13" font-weight="600" fill="#243449"><tspan x="3621.6" dy="0">Request failed</tspan></text><path d="M3621.6 501.5H3837.6" stroke="#edf0f3"/><circle cx="3625.6" cy="516.5" r="3" fill="#d65c65"/><text x="3634.6" y="519.5" font-size="9" fill="#64748b">Implemented</text><text x="3837.6" y="519.5" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="3993.6" y="409.5" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="4007.6" y="424.5" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="4021.1" y="442.5" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="4044.6" y="440.5" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="4009.6" y="468.5" font-size="13" font-weight="600" fill="#243449"><tspan x="4009.6" dy="0">Show error / retry</tspan></text><path d="M4009.6 501.5H4225.6" stroke="#edf0f3"/><circle cx="4013.6" cy="516.5" r="3" fill="#d65c65"/><text x="4022.6" y="519.5" font-size="9" fill="#64748b">Implemented</text><text x="4225.6" y="519.5" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Submitted code is compared with the hashed token, checked for expiry and attempt limits, then consumed.</title><rect x="3108.4" y="256" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="3122.4" y="271" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="3135.9" y="289" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="3159.4" y="287" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="3124.4" y="315" font-size="13" font-weight="600" fill="#243449"><tspan x="3124.4" dy="0">Consume and verify email OTP</tspan></text><path d="M3124.4 348H3340.4" stroke="#edf0f3"/><circle cx="3128.4" cy="363" r="3" fill="#8855c6"/><text x="3137.4" y="366" font-size="9" fill="#64748b">Implemented</text><text x="3340.4" y="366" text-anchor="end" font-size="9" fill="#7a8898">source :193</text></g><g><title>State and PKCE flow, code exchange, JWKS identity verification and resolveSocialUser. Runtime configuration and connectivity are Unverified.</title><rect x="3108.4" y="474" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="3122.4" y="489" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="3135.9" y="507" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="3159.4" y="505" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="3124.4" y="533" font-size="13" font-weight="600" fill="#243449"><tspan x="3124.4" dy="0">Google / Apple OAuth</tspan></text><path d="M3124.4 566H3340.4" stroke="#edf0f3"/><circle cx="3128.4" cy="581" r="3" fill="#219a97"/><text x="3137.4" y="584" font-size="9" fill="#64748b">Implemented</text><text x="3340.4" y="584" text-anchor="end" font-size="9" fill="#7a8898">source :118</text></g></g><text x="34" y="667" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>