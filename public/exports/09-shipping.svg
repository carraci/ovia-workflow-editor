<svg xmlns="http://www.w3.org/2000/svg" width="3140.8" height="539" viewBox="0 0 3140.8 539"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a1adb9"/></marker><marker id="arrowError" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d65c65"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#e0e6ed"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><rect y="76" width="100%" height="463" fill="url(#grid)"/><text x="34" y="30" font-family="Arial,sans-serif" fill="#778497" font-size="10" letter-spacing="2">OVIA / WORKFLOW ATLAS</text><text x="34" y="57" font-family="Arial,sans-serif" fill="#23344b" font-size="19" font-weight="700">Shipping &amp; delivery tracking</text><g font-family="Arial,sans-serif"><path d="M318,290 L388,290 L458,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,290 L776,290 L846,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,290 L1200.4,191 L1306.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1110.8" y="215.5" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="1147.2" y="228.5">Yes / accepted</tspan></text><path d="M1554.8,191 L1624.8,191 L1694.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1942.8,191 L2012.8,191 L2082.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M2330.8,191 L2400.8,191 L2470.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M2718.8,191 L2788.8,191 L2858.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1094,290 L1200.4,389 L1306.8,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="1113.4" y="314.5" width="67.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="1147.2" y="327.5">No / rejected</tspan></text><path d="M1554.8,389 L1624.8,389 L1694.8,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><g><title>Owner reviews order and initiates shipment / pickup.</title><rect x="70" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="84" y="244" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="97.5" y="262" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="121" y="260" font-size="10" font-weight="600" fill="#3979de">Trigger</text><text x="86" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Owner approves shipment</tspan></text><path d="M86 321H302" stroke="#edf0f3"/><circle cx="90" cy="336" r="3" fill="#3979de"/><text x="99" y="339" font-size="9" fill="#64748b">Implemented</text><text x="302" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Authorized owner executes controlled logistics.</title><rect x="458" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="472" y="244" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="485.5" y="262" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="509" y="260" font-size="10" font-weight="600" fill="#db8a2d">HTTP Request</text><text x="474" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">Create shipment</tspan></text><path d="M474 321H690" stroke="#edf0f3"/><circle cx="478" cy="336" r="3" fill="#db8a2d"/><text x="487" y="339" font-size="9" fill="#64748b">Implemented</text><text x="690" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :5</text></g><g><title>Payment capture, unrefunded state, package data and logistics lease checks prevent unsafe repeated actions.</title><rect x="846" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="860" y="244" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="873.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="897" y="260" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="862" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="862" dy="0">Paid and eligible?</tspan></text><path d="M862 321H1078" stroke="#edf0f3"/><circle cx="866" cy="336" r="3" fill="#8855c6"/><text x="875" y="339" font-size="9" fill="#64748b">Implemented</text><text x="1078" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :189</text></g><g><title>Courier API returns AWB and shipment metadata; pickup is requested through the shipping service. Runtime configuration and connectivity are Unverified.</title><rect x="1306.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="1320.8" y="145" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="1334.3" y="163" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="1357.8" y="161" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="1322.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Delhivery shipment + pickup</tspan></text><path d="M1322.8 222H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="237" r="3" fill="#219a97"/><text x="1335.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :152</text></g><g><title>Shipping data and logistics operation progress are embedded on the order.</title><rect x="1694.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1708.8" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1722.3" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1745.8" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1710.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">orders.shipping</tspan></text><path d="M1710.8 222H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="237" r="3" fill="#369969"/><text x="1723.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :172</text></g><g><title>Courier events are authenticated; refresh route can also reconcile tracking.</title><rect x="2082.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#db8a2d" stroke-opacity=".48" /><rect x="2096.8" y="145" width="27" height="27" rx="7" fill="#db8a2d" fill-opacity=".1"/><text x="2110.3" y="163" text-anchor="middle" font-size="15" fill="#db8a2d">↔</text><text x="2133.8" y="161" font-size="10" font-weight="600" fill="#db8a2d">Webhook</text><text x="2098.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Courier webhook / refresh</tspan></text><path d="M2098.8 222H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="237" r="3" fill="#db8a2d"/><text x="2111.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :8</text></g><g><title>Match AWB to stored order and map courier status into internal shipping status.</title><rect x="2470.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2484.8" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2498.3" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2521.8" y="161" font-size="10" font-weight="600" fill="#8855c6">Backend Service</text><text x="2486.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2486.8" dy="0">Normalize courier event</tspan></text><path d="M2486.8 222H2702.8" stroke="#edf0f3"/><circle cx="2490.8" cy="237" r="3" fill="#8855c6"/><text x="2499.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2702.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :185</text></g><g><title>Only verified shipment information is shown to customers.</title><rect x="2858.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#3979de" stroke-opacity=".48" /><rect x="2872.8" y="145" width="27" height="27" rx="7" fill="#3979de" fill-opacity=".1"/><text x="2886.3" y="163" text-anchor="middle" font-size="15" fill="#3979de">↗</text><text x="2909.8" y="161" font-size="10" font-weight="600" fill="#3979de">Response</text><text x="2874.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2874.8" dy="0">Customer tracking timeline</tspan></text><path d="M2874.8 222H3090.8" stroke="#edf0f3"/><circle cx="2878.8" cy="237" r="3" fill="#3979de"/><text x="2887.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="3090.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :1</text></g><g><title>Ambiguous courier writes are tracked for review instead of falsely declaring shipment success.</title><rect x="1306.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1320.8" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1334.3" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1357.8" y="359" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="1322.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Request failed</tspan></text><path d="M1322.8 420H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="435" r="3" fill="#d65c65"/><text x="1335.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :296</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="1694.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1708.8" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1722.3" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1745.8" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="1710.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">Show error / retry</tspan></text><path d="M1710.8 420H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="435" r="3" fill="#d65c65"/><text x="1723.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :296</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>