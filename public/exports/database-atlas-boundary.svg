<svg xmlns="http://www.w3.org/2000/svg" width="2364.8" height="539" viewBox="0 0 2364.8 539"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a1adb9"/></marker><marker id="arrowError" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d65c65"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#e0e6ed"/></pattern></defs><rect width="100%" height="100%" fill="#fff"/><rect y="76" width="100%" height="463" fill="url(#grid)"/><text x="34" y="30" font-family="Arial,sans-serif" fill="#778497" font-size="10" letter-spacing="2">OVIA / WORKFLOW ATLAS</text><text x="34" y="57" font-family="Arial,sans-serif" fill="#23344b" font-size="19" font-weight="700">MongoDB connection &amp; Atlas boundary</text><g font-family="Arial,sans-serif"><path d="M318,290 L388,290 L458,290" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,290 L812.4,191 L918.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="722.8000000000001" y="215.5" width="72.8" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#a1adb9"><tspan x="759.2" y="228.5">Yes / accepted</tspan></text><path d="M1166.8,191 L1236.8,191 L1306.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1554.8,191 L1624.8,191 L1694.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1942.8,191 L2012.8,191 L2082.8,191" fill="none" stroke="#a1adb9" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M706,290 L812.4,389 L918.8,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><rect x="725.4000000000001" y="314.5" width="67.60000000000001" height="20" rx="4" fill="#fff"/><text text-anchor="middle" font-size="10" fill="#d65c65"><tspan x="759.2" y="327.5">No / rejected</tspan></text><path d="M1166.8,389 L1236.8,389 L1306.8,389" fill="none" stroke="#d65c65" stroke-width="1.6"  marker-end="url(#arrowError)"/><g><title>Server code requests a shared MongoDB connection.</title><rect x="70" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="84" y="244" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="97.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="121" y="260" font-size="10" font-weight="600" fill="#8855c6">Trigger</text><text x="86" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="86" dy="0">Database operation requested</tspan></text><path d="M86 321H302" stroke="#edf0f3"/><circle cx="90" cy="336" r="3" fill="#8855c6"/><text x="99" y="339" font-size="9" fill="#64748b">Implemented</text><text x="302" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :30</text></g><g><title>Absence rejects live operations; no credentials are displayed.</title><rect x="458" y="229" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="472" y="244" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="485.5" y="262" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="509" y="260" font-size="10" font-weight="600" fill="#8855c6">IF / Switch</text><text x="474" y="288" font-size="13" font-weight="600" fill="#243449"><tspan x="474" dy="0">MONGODB_URI supplied?</tspan></text><path d="M474 321H690" stroke="#edf0f3"/><circle cx="478" cy="336" r="3" fill="#8855c6"/><text x="487" y="339" font-size="9" fill="#64748b">Implemented</text><text x="690" y="339" text-anchor="end" font-size="9" fill="#7a8898">source :31</text></g><g><title>MongoClient.connect, maxPoolSize 10 and serverSelectionTimeoutMS 6000 are actual code settings.</title><rect x="918.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="932.8" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="946.3" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="969.8" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="934.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="934.8" dy="0">Shared native-driver pool</tspan></text><path d="M934.8 222H1150.8" stroke="#edf0f3"/><circle cx="938.8" cy="237" r="3" fill="#369969"/><text x="947.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1150.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :34</text></g><g><title>MongoDB hosting, Atlas cluster tier, region, replica placement and network access rules cannot be inferred from the connection code.</title><rect x="1306.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#219a97" stroke-opacity=".48" /><rect x="1320.8" y="145" width="27" height="27" rx="7" fill="#219a97" fill-opacity=".1"/><text x="1334.3" y="163" text-anchor="middle" font-size="15" fill="#219a97">◎</text><text x="1357.8" y="161" font-size="10" font-weight="600" fill="#219a97">External API</text><text x="1322.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Hosted cluster / Atlas</tspan><tspan x="1322.8" dy="18">boundary</tspan></text><path d="M1322.8 222H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="237" r="3" fill="#219a97"/><text x="1335.8" y="240" font-size="9" fill="#64748b">Unverified</text><text x="1538.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :33</text></g><g><title>MONGODB_DB override or ovia default; writes can share ClientSession.withTransaction.</title><rect x="1694.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#369969" stroke-opacity=".48" /><rect x="1708.8" y="145" width="27" height="27" rx="7" fill="#369969" fill-opacity=".1"/><text x="1722.3" y="163" text-anchor="middle" font-size="15" fill="#369969">▤</text><text x="1745.8" y="161" font-size="10" font-weight="600" fill="#369969">Database Query</text><text x="1710.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="1710.8" dy="0">Database selection and</tspan><tspan x="1710.8" dy="18">transaction</tspan></text><path d="M1710.8 222H1926.8" stroke="#edf0f3"/><circle cx="1714.8" cy="237" r="3" fill="#369969"/><text x="1723.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="1926.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :103</text></g><g><title>Stored records or a surfaced database error return to business services.</title><rect x="2082.8" y="130" width="248" height="122" rx="12" fill="#fff" stroke="#8855c6" stroke-opacity=".48" /><rect x="2096.8" y="145" width="27" height="27" rx="7" fill="#8855c6" fill-opacity=".1"/><text x="2110.3" y="163" text-anchor="middle" font-size="15" fill="#8855c6">◆</text><text x="2133.8" y="161" font-size="10" font-weight="600" fill="#8855c6">Response</text><text x="2098.8" y="189" font-size="13" font-weight="600" fill="#243449"><tspan x="2098.8" dy="0">Repository result returned</tspan></text><path d="M2098.8 222H2314.8" stroke="#edf0f3"/><circle cx="2102.8" cy="237" r="3" fill="#8855c6"/><text x="2111.8" y="240" font-size="9" fill="#64748b">Implemented</text><text x="2314.8" y="240" text-anchor="end" font-size="9" fill="#7a8898">source :44</text></g><g><title>Validation, access, conflict or service errors are returned to the caller. Status and error shape depend on the specific route.</title><rect x="918.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="932.8" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="946.3" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="969.8" y="359" font-size="10" font-weight="600" fill="#d65c65">Error Handler</text><text x="934.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="934.8" dy="0">Request failed</tspan></text><path d="M934.8 420H1150.8" stroke="#edf0f3"/><circle cx="938.8" cy="435" r="3" fill="#d65c65"/><text x="947.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1150.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g><g><title>Failure end state. Caller receives the actual error; a retry may be offered by the UI.</title><rect x="1306.8" y="328" width="248" height="122" rx="12" fill="#fff" stroke="#d65c65" stroke-opacity=".48" /><rect x="1320.8" y="343" width="27" height="27" rx="7" fill="#d65c65" fill-opacity=".1"/><text x="1334.3" y="361" text-anchor="middle" font-size="15" fill="#d65c65">!</text><text x="1357.8" y="359" font-size="10" font-weight="600" fill="#d65c65">Response</text><text x="1322.8" y="387" font-size="13" font-weight="600" fill="#243449"><tspan x="1322.8" dy="0">Show error / retry</tspan></text><path d="M1322.8 420H1538.8" stroke="#edf0f3"/><circle cx="1326.8" cy="435" r="3" fill="#d65c65"/><text x="1335.8" y="438" font-size="9" fill="#64748b">Implemented</text><text x="1538.8" y="438" text-anchor="end" font-size="9" fill="#7a8898">source :69</text></g></g><text x="34" y="521" font-family="Arial,sans-serif" fill="#778497" font-size="10">Source-based documentation | Dashed edges: proposed | Runtime connectivity: Unverified | Not an executable n8n workflow</text></svg>